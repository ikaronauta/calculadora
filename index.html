<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">
    <title>Calculadora Basica</title>
</head>

<body>
    <div class="calculadora">
        <div class="pantalla" id="pantalla"></div>
        <div class="contenedorTeclado">
            <div class="numerico">
                <p class="numero">7</p>
                <p class="numero">8</p>
                <p class="numero">9</p>
                <p class="numero">4</p>
                <p class="numero">5</p>
                <p class="numero">6</p>
                <p class="numero">1</p>
                <p class="numero">2</p>
                <p class="numero">3</p>
                <p class="hide"></p>
                <p class="numero">0</p>
                <p class="hide"></p>
            </div>
            <div class="simbolos">
                <p id="suma">+</p>
                <p id="resta">-</p>
                <p id="multi">*</p>
                <p id="div">/</p>
                <p id="borrar">C</p>
            </div>
        </div>
        <div class="contenedorIgual" id="igual">
            <p>=</p>
        </div>
        <div class="marca">
            <p>CASIO</p>
        </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
